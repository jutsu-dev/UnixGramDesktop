name: Сообщение об ошибке
description: Ошибка в клиенте UnixGram Desktop или в его установщике
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        UnixGram Desktop — неофициальный клиент. Ошибки сайта UnixGram, которые воспроизводятся в обычном браузере, здесь не исправляются.

        Токены, cookie и личную переписку не прикладывайте. Об уязвимостях пишите приватно, по [SECURITY.md](https://github.com/jutsu-dev/UnixGramDesktop/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Версия клиента
      description: Настройки, раздел «Центр безопасности».
      placeholder: 1.3.4
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Окно аккаунта (сайт UnixGram в клиенте)
        - UnixPlace
        - Настройки
        - Темы оформления
        - Аккаунты
        - Трей и уведомления
        - Горячие клавиши
        - Discord Rich Presence
        - Внешние ссылки и навигация
        - Установщик
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: По порядку.
      placeholder: |
        1. Открыть...
        2. Нажать...
        3. Наблюдать...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Воспроизводится ли ошибка на сайте UnixGram в обычном браузере
      options:
        - Нет, только в клиенте
        - Да
        - Не проверялось
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Дополнительные сведения
      description: Тема, масштаб, режим Liquid Glass, снимок окна без личных данных.
  - type: checkboxes
    id: conduct
    attributes:
      label: Кодекс поведения
      options:
        - label: "[Кодекс поведения](https://github.com/jutsu-dev/UnixGramDesktop/blob/main/CODE_OF_CONDUCT.md) прочитан."
          required: true
