name: Предложение
description: Новая функция или улучшение клиента UnixGram Desktop
title: "[idea] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        UnixGram Desktop — неофициальный клиент. Содержимое окон — лента, сообщения, профили, подарки — принадлежит сайту UnixGram и в этом репозитории не изменяется. Предложения принимаются по функциям оболочки: окнам, трею, темам, настройкам, горячим клавишам и интеграциям.
  - type: input
    id: summary
    attributes:
      label: Краткое описание
      placeholder: Что предлагается добавить или изменить
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Область
      options:
        - Окна и навигация
        - Настройки
        - Темы оформления
        - Аккаунты
        - Трей и уведомления
        - Горячие клавиши
        - Discord Rich Presence
        - Установщик
        - Документация
        - Другое
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Решаемая проблема
      description: Какую задачу пользователя решает предложение.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
      placeholder: Опишите сценарий с точки зрения пользователя
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Примеры
      description: Снимки экрана или ссылки на аналогичные решения.
