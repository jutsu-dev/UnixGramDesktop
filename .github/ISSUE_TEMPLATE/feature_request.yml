name: Предложение
description: Новая функция или улучшение клиента UnixGram Desktop
title: "[idea] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        UnixGram Desktop — неофициальный клиент. Ленту, сообщения, профили и подарки отдаёт сайт UnixGram, здесь они не меняются. Предложения принимаются по оболочке: окна, трей, темы, настройки, горячие клавиши, интеграции.
  - type: input
    id: summary
    attributes:
      label: Краткое описание
      placeholder: Что добавить или изменить
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Область
      options:
        - Окна и навигация
        - Настройки
        - Темы оформления
        - Аккаунты
        - Трей и уведомления
        - Горячие клавиши
        - Discord Rich Presence
        - Установщик
        - Документация
        - Другое
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Решаемая проблема
      description: Какую задачу пользователя решает предложение.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
      placeholder: Сценарий глазами пользователя
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Примеры
      description: Снимки экрана или ссылки на похожие решения.
  - type: checkboxes
    id: conduct
    attributes:
      label: Кодекс поведения
      options:
        - label: "[Кодекс поведения](https://github.com/jutsu-dev/UnixGramDesktop/blob/main/CODE_OF_CONDUCT.md) прочитан."
          required: true
