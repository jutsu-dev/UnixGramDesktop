[package]
name = "unixgram-desktop"
version = "1.3.4"
description = "Unofficial community Windows client for the UnixGram social network"
authors = ["UnixGram History community"]
license = "MIT"
repository = "https://github.com/jutsu-dev/UnixGramDesktop"
edition = "2024"
publish = false

[lib]
name = "unixgram_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
discord-rich-presence = "1.1"
# Only deletes Credential Manager entries left behind by versions that stored sessions there.
keyring = "4.1"
open = "5.3"
# Health probe of the connection monitor; no cookies, uploads or redirects are needed.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
