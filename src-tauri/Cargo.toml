[package]
name = "unixgram-desktop"
version = "1.3.1"
description = "Community desktop fork foundation for UnixGram"
authors = ["UnixGram History community"]
license = "MIT"
edition = "2024"

[lib]
name = "unixgram_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
discord-rich-presence = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.1"
mime_guess = "2.0"
open = "5.3"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "time"] }
urlencoding = "2.1"
