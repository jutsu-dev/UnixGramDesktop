.ink{fill:#191b24}
.mut{fill:#5b6074}
.acc{fill:#5948c7}
.l{fill:none;stroke:#191b24;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.lm{fill:none;stroke:#5b6074;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
.la{fill:none;stroke:#5948c7;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.box{fill:#ffffff;stroke:#191b24;stroke-width:1}
.cap{font-family:'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:8.5px;letter-spacing:1.3px;fill:#5b6074}
.hd{font-family:'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:1.2px;fill:#191b24}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:no-preference){.flow{animation:flow 2.4s linear infinite}}
</style>
