<svg xmlns="http://www.w3.org/2000/svg" width="830" height="520" viewBox="0 0 830 520" role="img" aria-labelledby="t d">
<title id="t">Схема устройства UnixGram Desktop</title>
<desc id="d">Нативный процесс на Rust и Tauri 2 держит окна WebView2. Окна аккаунтов загружают unixgram.com, окна UnixPlace загружают place.unixgram.com. Команды IPC вызывает только локальное окно настроек. Процесс управляет треем, горячими клавишами, статусом Discord и монитором связи.</desc>
